
name: Generate Datas

on:
  schedule: # executa a cada 12 horas (uma vez em cada intervalo)
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write  # necessário para fazer push no branch 'output'

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest

    steps:
      # Checkout do repositório (recomendado)
      - uses: actions/checkout@v4

      # Snake Animation
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: RodrigoamaralDev
          svg_out_path: dist/github-contribution-grid-snake.svg
          # opcional: gerar também em GIF/PNG se quiser
          # gif_out_path: dist/github-contribution-grid-snake.gif
          # png_out_path: dist/github-contribution-grid-snake.png

      # Publicar no branch 'output'
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          # opcional: manter histórico de commits no branch de saída
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
